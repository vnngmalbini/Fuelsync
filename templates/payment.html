<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment | FuelSync</title>
    <link rel="stylesheet" href="{% static 'css/ui-base.css' %}">
    <link rel="stylesheet" href="{% static 'css/fuelsync-pages.css' %}">
    <link rel="stylesheet" href="{% static 'css/professional-polish.css' %}">
    <style>
        body{
            min-height:100vh;
            display:grid;
            place-items:center;
            padding:24px;
            max-width:600px;
            margin-left:auto;
            margin-right:auto;
        }
        .box{
            width:100%;
            max-width:420px;
            padding:24px;
            border-radius:16px;
            text-align:center;
        }
        h1{margin:0 0 10px;font-size:1.8rem;color:#0D47A1}
        h2{margin:0 0 20px;font-size:1.5rem;color:#1565C0}
        img{width:min(260px,100%);display:block;margin:0 auto 12px;border-radius:10px;border:1px solid #E2E8F0;padding:8px;background:#fff}
        p{margin:0;color:#718096;font-size:0.98rem}
        .hint{margin-top:18px;padding:12px 14px;border-radius:10px;background:#F0F7FF;border-left:4px solid #0D47A1;color:#1A202C;text-align:left}
        @media (max-width:640px){.box{padding:24px}}
    </style>
</head>
<body>

<div class="box">
    <h1>Scan to Pay</h1>
    <h2>GHS {{ amount }}</h2>

    <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code">

    <div class="hint">Scan this QR code with your mobile money app to complete payment.</div>
    <div id="payment-status" class="hint" style="margin-top:12px; display:none;"></div>
</div>

<script>
    (function () {
        const reference = "{{ reference|escapejs }}";
        const verifyApiUrl = "{{ verify_api_url|escapejs }}";
        const dashboardUrl = "{{ dashboard_url|escapejs }}";
        const statusNode = document.getElementById('payment-status');
        let attempts = 0;
        const maxAttempts = 120;

        function setStatus(message) {
            if (!statusNode) return;
            statusNode.style.display = 'block';
            statusNode.textContent = message;
        }

        async function verifyPayment() {
            if (!reference || attempts >= maxAttempts) {
                return;
            }

            attempts += 1;
            try {
                const response = await fetch(`${verifyApiUrl}?reference=${encodeURIComponent(reference)}`, {
                    headers: { 'Accept': 'application/json' },
                    cache: 'no-store',
                });

                const data = await response.json();
                if (data && data.status) {
                    setStatus('Payment confirmed! Taking you to your receipt...');
                    const ref = (data && data.reference) || reference;
                    window.location.href = '/payment/success/' + (ref ? '?reference=' + encodeURIComponent(ref) : '');
                    return;
                }

                setStatus('Waiting for payment confirmation...');
            } catch (error) {
                setStatus('Waiting for payment confirmation...');
            }

            if (attempts < maxAttempts) {
                window.setTimeout(verifyPayment, 3000);
            }
        }

        if (reference) {
            setStatus('Waiting for payment confirmation...');
            window.setTimeout(verifyPayment, 3000);
        }
    })();
</script>

</body>
</html>
