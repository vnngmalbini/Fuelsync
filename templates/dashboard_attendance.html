{% extends 'dashboard_layout.html' %}
{% load static %}

{% block title %}Live Stream - FuelSync{% endblock %}

{% block dashboard_extra_css %}
<style>
.stream-card{width:100%;}
.stream-frame{position:relative;height:65vh;min-height:420px;background:#020617;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.stream-frame img{display:block;width:100%;height:100%;object-fit:cover;}
.stream-placeholder{position:absolute;color:#94a3b8;font-size:.95rem;text-align:center;padding:20px;}
.stream-status{margin:12px 0 0;color:#64748b;font-size:.85rem;}
</style>
{% endblock %}

{% block page_content %}
<div class="page-shell">
    <div class="page-header">
        <div class="page-header-copy">
            <h1 class="page-title">Live Stream</h1>
            <p class="page-subtitle">View the live feed from the ESP32 camera.</p>
        </div>
    </div>

    <div class="content-card stream-card">
        <div class="content-card-header">
            <h2 class="content-card-title"><i class="bi bi-camera-video"></i> Live Stream</h2>
        </div>
        <div class="card-body">
            <div class="stream-frame">
                <img src="http://10.136.118.229/stream" alt="Live ESP32 camera stream">
            </div>
            <p class="stream-status">Live ESP32 camera stream</p>
        </div>
    </div>
</div>
{% endblock %}
